<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Todo App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toastContainer" class="toast-container"></div>

  <div id="app">
    <header id="appHeader">
      <div class="header-left">
        <h1 id="headerTitle">Todo App</h1>
        <span id="todoCount" class="todo-count">0</span>

      </div>
      <div class="header-actions" id="headerActions">
        <button id="viewToggle" class="icon-btn" title="Toggle view (List/Calendar)">📋</button>
        <button id="clearCompleted" class="icon-btn hidden" title="Clear completed">🗑️</button>
        <button id="manageTags" class="icon-btn" title="Tags">🏷️</button>
        <button id="themeToggle" class="icon-btn" title="Toggle theme">🌙</button>

        <button id="pipBtn" class="icon-btn" title="Pop Out Ticker">📺</button>
        <button id="pomoFloatBtn" class="icon-btn" title="Floating Pomodoro">⏱️</button>
        <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
      </div>
    </header>

    <!-- News Ticker -->
    <div class="ticker-window">
      <div class="ticker-train" id="todoTicker"></div>
    </div>

    <!-- Smart Lists -->
    <div id="smartLists" class="smart-lists"></div>

    <!-- Search -->
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search todos... (press / to focus)" />
      <div class="search-actions">
        <button id="clearSearch" class="search-clear hidden">✕</button>
        <button id="saveSmartListBtn" class="save-sl-btn" title="Save current view as Smart List">📌</button>
      </div>
    </div>

    <!-- Smart Quick Add Bar -->
    <div id="quickAddBar" class="quick-add-bar">
      <div class="quick-add-inner">
        <span class="quick-add-icon">⚡</span>
        <input type="text" id="quickAddInput" placeholder='Quick add: "Buy milk tomorrow #shopping high"' />
        <button id="quickAddBtn" class="quick-add-go" title="Add (Enter)">+</button>
      </div>
      <div id="quickAddPreview" class="quick-add-preview hidden">
        <div id="quickAddChips" class="qa-chips"></div>
        <span id="quickAddHint" class="qa-hint">Press Enter to add</span>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="filter-chip active" data-filter="all">
        <span class="chip-label">All</span>
        <span id="countAll" class="chip-count">0</span>
      </button>
      <button class="filter-chip" data-filter="pending">
        <span class="chip-label">Pending</span>
        <span id="countPending" class="chip-count">0</span>
      </button>
      <button class="filter-chip" data-filter="done">
        <span class="chip-label">Done</span>
        <span id="countDone" class="chip-count">0</span>
      </button>
    </div>

    <!-- View Indicator -->
    <div id="viewIndicator" class="view-indicator">
      <span class="vi-badge">📋 List View</span>
    </div>

    <!-- Todo List -->
    <div id="todoList" class="todo-list"></div>

    <!-- Calendar View -->
    <div id="calendarView" class="calendar-view hidden">
      <div class="cal-header">
        <button class="cal-nav" onclick="calPrev()">◀</button>
        <span id="calTitle" class="cal-title"></span>
        <button class="cal-nav" onclick="calNext()">▶</button>
      </div>
      <div class="cal-weekdays">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div id="calGrid" class="cal-grid"></div>
      <div id="calTodos" class="cal-todos"></div>    </div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">📝</div>
      <h2 id="emptyTitle">No todos yet</h2>
      <p id="emptySubtitle">Click + to add your first todo</p>
    </div>

    <!-- Speed Dial FAB -->
    <div id="speedDial" class="speed-dial">
      <div id="speedDialBackdrop" class="speed-dial-backdrop hidden" onclick="closeSpeedDial()"></div>
      <div id="speedDialActions" class="speed-dial-actions hidden">
        <button class="sd-action" onclick="closeSpeedDial();openAddModal()" title="New Todo">
          <span class="sd-action-icon">✏️</span>
          <span class="sd-action-label">New Todo</span>
        </button>
        <button class="sd-action" onclick="closeSpeedDial();document.getElementById('quickAddInput').focus()" title="Quick Add">
          <span class="sd-action-icon">⚡</span>
          <span class="sd-action-label">Quick Add</span>
        </button>

      </div>
      <button id="addBtn" class="fab" title="New Todo (N)">
        <span id="fabIcon" class="fab-icon">+</span>
      </button>
    </div>

    <div id="shortcutHint" class="shortcut-hint">
      <kbd>N</kbd> New · <kbd>/</kbd> Search · <kbd>V</kbd> Views · <kbd>Esc</kbd> Close
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">✨ New Todo</h2>
        <button class="icon-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <label>Title *</label>
        <input type="text" id="todoTitle" placeholder="What needs to be done?" />

        <label>Description</label>
        <div class="rich-editor">
          <div class="rich-toolbar">
            <button class="rich-btn" onclick="richBold()" title="Bold"><b>B</b></button>
            <button class="rich-btn" onclick="richItalic()" title="Italic"><i>I</i></button>
            <button class="rich-btn" onclick="richUnderline()" title="Underline"><u>U</u></button>
            <button class="rich-btn" onclick="richCode()" title="Code">&lt;/&gt;</button>
            <button class="rich-btn" onclick="richList()" title="Bullet List">•≡</button>
            <button class="rich-btn" onclick="richCheckbox()" title="Checklist">☑</button>
            <span style="flex:1"></span>
            <button id="mdPreviewBtn" class="rich-btn" onclick="toggleMdPreview()" title="Preview">👁️</button>
          </div>
          <textarea id="todoDesc" placeholder="Add details... (Markdown: **bold**, _italic_, - [ ] checklist)" rows="3" oninput="onDescInput()"></textarea>
          <div id="mdPreview" class="md-preview hidden"></div>
        </div>

        <div class="modal-row">
          <div>
            <label>Priority</label>
            <div class="priority-selector">
              <button class="priority-btn" data-priority="high">🔴 High</button>
              <button class="priority-btn active" data-priority="medium">🟠 Medium</button>
              <button class="priority-btn" data-priority="low">🟢 Low</button>
            </div>
          </div>
          <div>
            <label>Due Date</label>
            <input type="date" id="todoDueDate" />
            <div class="quick-dates">
              <button class="quick-date-btn" data-offset="0">Today</button>
              <button class="quick-date-btn" data-offset="1">Tomorrow</button>
              <button class="quick-date-btn" data-offset="7">Next week</button>
            </div>
            <button id="clearDate" class="text-btn">Clear date</button>
          </div>
        </div>

        <label>Tags</label>
        <div id="tagSelector" class="tag-selector"></div>

        <label>⏰ Reminder</label>
        <label class="switch">
          <input type="checkbox" id="todoReminder" />
          <span class="slider"></span>
          <span class="switch-label" id="reminderLabel">No reminder set</span>
        </label>
        <input type="datetime-local" id="todoReminderTime" class="hidden" />

        <label>📌 Pin to top</label>
        <label class="switch">
          <input type="checkbox" id="todoPinned" />
          <span class="slider"></span>
          <span class="switch-label">Keep this todo pinned at top</span>
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" id="saveBtn">✨ Add Todo</button>
      </div>
    </div>
  </div>

  <!-- Tags Modal -->
  <div id="tagModal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>🏷️ Manage Tags</h2>
        <button class="icon-btn" onclick="closeTagModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="cat-add-row">
          <input type="text" id="tagName" placeholder="Tag name" />
          <div id="tagColorPicker" class="color-picker"></div>
          <button class="btn-primary" id="addTagBtn">+</button>
        </div>
        <div id="tagList" class="cat-list"></div>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content" style="max-width:420px;">
      <div class="modal-header">
        <h2>⚙️ Settings</h2>
        <button class="icon-btn" onclick="closeSettings()">✕</button>
      </div>
      <div class="modal-body">
        <div class="settings-section">
          <div class="settings-section-title">📦 Updates</div>
          <div id="updateInfo" class="update-info">
            <span id="updateStatusText">Checking for updates...</span>
          </div>
          <div id="updateActions" class="update-actions">
            <button class="btn-primary" id="checkUpdateBtn" onclick="manualCheckUpdates()">🔄 Check for Updates</button>
            <button class="btn-primary hidden" id="downloadUpdateBtn" onclick="startUpdateDownload()">⬇ Download Update</button>
            <button class="btn-primary hidden" id="installUpdateBtn" onclick="quitAndInstall()">🚀 Restart & Install</button>
          </div>
          <div id="updateProgressWrap" class="update-progress-wrap hidden">
            <div class="update-progress-bar">
              <div id="updateProgressFill" class="update-progress-fill" style="width:0%"></div>
            </div>
            <span id="updateProgressText" class="update-progress-text">0%</span>
          </div>
          <!-- Lottie Animation for update status -->
          <div id="updateAnimationWrap" class="update-animation-wrap hidden">
            <div id="lottieAnimation" class="lottie-animation"></div>
          </div>
        </div>
        <div class="settings-section">
          <div class="settings-section-title">ℹ About</div>
          <div class="about-info">
            <span>Todo App v1.16.0</span>
            <span style="font-size:12px;color:var(--text-muted);">Built with Electron</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
