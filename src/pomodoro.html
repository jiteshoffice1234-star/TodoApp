<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline';">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { 
  height: 100%; overflow: hidden;
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
}
body {
  -webkit-app-region: drag; user-select: none; cursor: default;
  background: transparent;
  display: flex; align-items: center; justify-content: center;
}

/* ========== SETUP VIEW (Big Clock) ========== */
#setupView {
  width: 320px; background: #ffffff;
  border-radius: 24px; padding: 32px 28px;
  text-align: center; position: relative;
  box-shadow: 0 8px 40px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
  -webkit-app-region: drag;
}
#setupView.hidden { display: none; }

/* Close button */
.setup-close {
  position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
  border-radius: 50%; border: none; background: #f5f5f5;
  color: #888; font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-app-region: no-drag; transition: all 0.2s ease;
}
.setup-close:hover { background: #eee; color: #333; transform: rotate(90deg); }

/* Time picker */
.time-picker {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  margin: 24px 0; -webkit-app-region: no-drag;
}
.time-display {
  font-size: 72px; font-weight: 300; color: #1a1a1a;
  font-variant-numeric: tabular-nums; min-width: 140px;
  line-height: 1; letter-spacing: -2px;
}
.time-unit {
  font-size: 13px; color: #999; margin-top: 4px;
  text-transform: lowercase;
}
.time-arrows {
  display: flex; flex-direction: column; gap: 8px;
}
.arrow-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid #e0e0e0;
  background: #fff; color: #666; font-size: 14px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s ease;
}
.arrow-btn:hover { background: #f8f8f8; border-color: #ccc; color: #333; }
.arrow-btn:active { transform: scale(0.95); background: #f0f0f0; }

/* Info text */
.setup-info {
  font-size: 13px; color: #888; margin-bottom: 20px;
}

/* Skip breaks */
.skip-breaks {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-bottom: 24px; -webkit-app-region: no-drag;
}
.skip-breaks input[type="checkbox"] {
  width: 18px; height: 18px; border-radius: 4px; border: 2px solid #ddd;
  cursor: pointer; accent-color: #1a1a1a;
}
.skip-breaks label {
  font-size: 13px; color: #666; cursor: pointer;
}

/* Start button */
.start-btn {
  width: 100%; padding: 16px; border-radius: 14px; border: none;
  background: #1a1a1a; color: #fff;
  font-size: 15px; font-weight: 600; cursor: pointer;
  transition: all 0.2s ease; -webkit-app-region: no-drag;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.start-btn:hover { background: #333; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
.start-btn:active { transform: scale(0.98); }

/* ========== RUNNING VIEW (Small Pill) ========== */
#pillView {
  display: none; align-items: center; gap: 8px;
  background: #ffffff; border-radius: 24px; padding: 8px 12px 8px 16px;
  border: 1px solid #e8e8e8;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  -webkit-app-region: drag;
}
#pillView.active { display: flex; }

#pillTimer {
  font-size: 16px; font-weight: 600; letter-spacing: 0.5px;
  font-variant-numeric: tabular-nums; color: #1a1a1a;
  min-width: 55px;
}
.pill-btn {
  -webkit-app-region: no-drag;
  width: 28px; height: 28px; border-radius: 50%; border: none;
  background: #f5f5f5; color: #666; font-size: 11px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s ease; flex-shrink: 0;
}
.pill-btn:hover { background: #eee; color: #333; }
.pill-close {
  -webkit-app-region: no-drag;
  width: 20px; height: 20px; border-radius: 50%; border: none;
  background: none; color: #bbb; font-size: 10px;
  cursor: pointer; display: none; align-items: center; justify-content: center;
}
body:hover .pill-close { display: flex; }
.pill-close:hover { color: #e53e3e; background: #fff5f5; }

/* Progress bar */
.progress-container {
  position: absolute; bottom: 0; left: 24px; right: 24px; height: 3px;
  background: #f0f0f0; border-radius: 2px; overflow: hidden;
}
.progress-bar {
  height: 100%; background: #1a1a1a; border-radius: 2px;
  transition: width 1s linear;
}
</style>
</head>
<body>
  <!-- SETUP VIEW (Big Clock) -->
  <div id="setupView" style="position:relative;">
    <button class="setup-close" id="setupClose">✕</button>
    <div class="time-picker">
      <div class="time-arrows">
        <button class="arrow-btn" id="upBtn">▲</button>
        <button class="arrow-btn" id="downBtn">▼</button>
      </div>
      <div>
        <div class="time-display" id="timeDisplay">25</div>
        <div class="time-unit">minutes</div>
      </div>
    </div>
    <div class="setup-info" id="setupInfo">You'll have 1 break</div>
    <div class="skip-breaks">
      <input type="checkbox" id="skipBreaks">
      <label for="skipBreaks">Skip breaks</label>
    </div>
    <button class="start-btn" id="startBtn">▶ Start focus session</button>
    <div class="progress-container" id="setupProgress" style="display:none;">
      <div class="progress-bar" id="setupProgressBar" style="width:0%"></div>
    </div>
  </div>

  <!-- RUNNING VIEW (Small Pill) -->
  <div id="pillView">
    <span id="pillTimer">25:00</span>
    <button class="pill-btn" id="pillPlay" title="Pause">⏸</button>
    <button class="pill-btn pill-close" id="pillClose" title="Stop">✕</button>
  </div>

<script>
(function() {
  const setupView = document.getElementById('setupView');
  const pillView = document.getElementById('pillView');
  const timeDisplay = document.getElementById('timeDisplay');
  const setupInfo = document.getElementById('setupInfo');
  const startBtn = document.getElementById('startBtn');
  const setupClose = document.getElementById('setupClose');
  const upBtn = document.getElementById('upBtn');
  const downBtn = document.getElementById('downBtn');
  const skipBreaks = document.getElementById('skipBreaks');
  const pillTimer = document.getElementById('pillTimer');
  const pillPlay = document.getElementById('pillPlay');
  const pillClose = document.getElementById('pillClose');
  const progressBar = document.getElementById('setupProgressBar');

  const api = window.pomodoroApi || {
    onState: (cb) => {},
    onTheme: () => {},
    closePomodoro: () => {},
    sendCommand: (cmd) => {},
    resizeWindow: (w, h) => Promise.resolve(),
    getSettings: () => Promise.resolve({}),
    saveSettings: (s) => Promise.resolve(),
  };

  let selectedMinutes = 25;
  let isRunning = false;
  let totalSeconds = 0;

  // Update display
  function updateSetupInfo() {
    const breaks = Math.floor(selectedMinutes / 25);
    setupInfo.textContent = breaks > 0 
      ? `You'll have ${breaks} break${breaks > 1 ? 's' : ''}` 
      : 'Short focus session';
    timeDisplay.textContent = selectedMinutes;
  }

  // Arrow buttons
  upBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    selectedMinutes = Math.min(120, selectedMinutes + 5);
    updateSetupInfo();
  });

  downBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    selectedMinutes = Math.max(5, selectedMinutes - 5);
    updateSetupInfo();
  });

  // Mouse wheel on time display
  timeDisplay.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.deltaY < 0) selectedMinutes = Math.min(120, selectedMinutes + 5);
    else selectedMinutes = Math.max(5, selectedMinutes - 5);
    updateSetupInfo();
  });

  // Start button
  startBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    totalSeconds = selectedMinutes * 60;
    // Switch to pill view
    setupView.classList.add('hidden');
    pillView.classList.add('active');
    isRunning = true;
    // Resize window to small pill
    api.resizeWindow(180, 44);
    // Send start command
    api.sendCommand('start:' + selectedMinutes + ':' + (skipBreaks.checked ? '1' : '0'));
  });

  // Close setup
  setupClose.addEventListener('click', (e) => {
    e.stopPropagation();
    api.closePomodoro();
  });

  // Pill play/pause
  pillPlay.addEventListener('click', (e) => {
    e.stopPropagation();
    api.sendCommand('toggle');
  });

  // Pill close (stop)
  pillClose.addEventListener('click', (e) => {
    e.stopPropagation();
    api.sendCommand('stop');
  });

  // Right-click closes
  document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    api.closePomodoro();
  });

  // State updates from main process
  api.onState((state) => {
    if (!state) return;

    if (isRunning && !state.isStopped) {
      // Update pill timer
      const min = Math.floor(state.remainingSeconds / 60);
      const sec = state.remainingSeconds % 60;
      pillTimer.textContent = min + ':' + String(sec).padStart(2, '0');
      pillPlay.textContent = state.isRunning ? '⏸' : '▶';
    }

    // If stopped/completed, show setup again
    if (state.isStopped) {
      isRunning = false;
      pillView.classList.remove('active');
      setupView.classList.remove('hidden');
      api.resizeWindow(320, 340);
      updateSetupInfo();
    }
  });

  // Load saved settings
  api.getSettings().then(settings => {
    if (settings.pomodoroMinutes) {
      selectedMinutes = settings.pomodoroMinutes;
    }
    if (settings.skipBreaks) {
      skipBreaks.checked = settings.skipBreaks;
    }
    updateSetupInfo();
  });

  // Initialize
  updateSetupInfo();
})();
</script>
</body>
</html>
