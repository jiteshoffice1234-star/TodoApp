<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline';">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  overflow: hidden; font-family: 'Segoe UI', sans-serif; height: 100vh;
  display: flex; align-items: center; -webkit-app-region: drag; user-select: none;
  cursor: default;
}
body.theme-light { background: #1a1a1a; }
body.theme-dark { background: #0a0a0a; }
body.theme-neobrutalism { background: #1a1a00; }
body.theme-glass { background: #000000; }
body.theme-minimal { background: #000000; }
body.theme-clay { background: #3D3028; }

/* Viewport clips the train and gives a soft edge fade (mask is fixed to the
   container, so the moving content fades in/out at the sides). */
#pipViewport {
  position: relative; width: 100%; height: 100%;
  overflow: hidden; display: flex; align-items: center;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
}

#pipContent {
  display: inline-block; white-space: nowrap;
  will-change: transform;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

/* Hover pause is handled via JS _paused flag. The dim is applied in JS too
   (not CSS !important) so it never fights the fade-in/out transition. */
body:hover #pipContent {
  opacity: 0.85;
}

.ticker-item {
  display: inline-block; padding: 0 15px; font-weight: 600; font-size: 13px;
  white-space: nowrap;
}
body.theme-light .ticker-item { color: #00ffcc; }
body.theme-dark .ticker-item { color: #00ffcc; }
body.theme-neobrutalism .ticker-item { color: #FFD700; }
body.theme-glass .ticker-item { color: #64B4FF; }
body.theme-minimal .ticker-item { color: #ffffff; }
body.theme-clay .ticker-item { color: #D4A574; }

/* Close button */
#closeBtn {
  position: fixed; top: 2px; right: 4px; width: 20px; height: 20px;
  border: none; background: none; color: #666; font-size: 14px;
  cursor: pointer; display: none; align-items: center; justify-content: center;
  border-radius: 4px; z-index: 10; line-height: 1;
  -webkit-app-region: no-drag;
}
#closeBtn:hover { background: rgba(255,255,255,0.1); color: #ff4444; }
body:hover #closeBtn { display: flex; }
body.theme-neobrutalism #closeBtn { color: #FFD700; }
body.theme-neobrutalism #closeBtn:hover { color: #ff4444; }
</style></head>
<body class="theme-light">
  <div id="pipViewport">
    <div id="pipContent"></div>
  </div>
  <button id="closeBtn" title="Close (right-click anywhere)">✕</button>
<script>
(function() {
  const viewport = document.getElementById('pipViewport');
  const pipEl = document.getElementById('pipContent');
  const closeBtn = document.getElementById('closeBtn');

  // ========== Seamless JS-Driven Scrolling ==========
  // A SINGLE persistent RAF loop reads the latest state every frame.
  // It always reschedules itself, so a content swap can never kill it.
  // (The old implementation bailed out of the loop on content updates
  //  but left _rafId set, permanently freezing the ticker.)

  let _scrollPos = 0;       // current translateX (negative = scrolled left)
  let _scrollSpeed = 0.8;   // px per frame at 60fps
  let _oneCopyWidth = 0;    // width of a single content copy
  let _singleHtml = '';     // the raw single-copy content (for re-render on resize)
  let _rafId = null;
  let _paused = false;

  // Speed aims for ~30s per full copy width
  function calcSpeed(width) {
    if (width <= 0) return 0.8;
    return Math.max(0.3, Math.min(2.5, width / (30 * 60)));
  }

  // Persistent loop — never bails permanently.
  function tick() {
    _rafId = requestAnimationFrame(tick);
    if (_paused || _oneCopyWidth <= 0) return;
    _scrollPos -= _scrollSpeed;
    // Seamless loop: wrap by one copy width, not reset to 0, so the
    // duplicated train gives an unbroken scroll.
    if (Math.abs(_scrollPos) >= _oneCopyWidth) _scrollPos += _oneCopyWidth;
    pipEl.style.transform = 'translateX(' + _scrollPos + 'px)';
  }

  function startLoop() {
    if (_rafId) return; // already running
    _rafId = requestAnimationFrame(tick);
  }

  function stopLoop() {
    if (_rafId) { cancelAnimationFrame(_rafId); _rafId = null; }
  }

  // Duplicate the single content copy enough times to fill at least 2x the
  // viewport, guaranteeing a seamless loop regardless of item count.
  function renderCopies(singleHtml) {
    _singleHtml = singleHtml;
    pipEl.innerHTML = singleHtml;
    const singleW = pipEl.scrollWidth || 1;
    const viewW = viewport.clientWidth || window.innerWidth || 400;
    const copies = Math.max(2, Math.ceil((viewW * 2) / singleW));
    if (copies > 1) pipEl.innerHTML = singleHtml.repeat(copies);
    return singleW;
  }

  // Set content and resume scrolling from the same visual position
  function setContent(html) {
    // Save current scroll ratio before the swap so the animation continues
    // from the same visual point (no jump on every todo change).
    const ratio = _oneCopyWidth > 0
      ? Math.min(0.99, Math.abs(_scrollPos) / _oneCopyWidth)
      : 0;

    if (window._pipFadeTimer) { clearTimeout(window._pipFadeTimer); window._pipFadeTimer = null; }

    pipEl.style.opacity = '0';
    window._pipFadeTimer = setTimeout(() => {
      const hasItems = !!(html && html.trim());
      const single = hasItems
        ? html
        : '<span class="ticker-item">✅ All caught up — no pending tasks!</span>';

      _oneCopyWidth = renderCopies(single);
      _scrollSpeed = calcSpeed(_oneCopyWidth);

      _scrollPos = -(ratio * _oneCopyWidth);
      if (Math.abs(_scrollPos) >= _oneCopyWidth) _scrollPos = 0;
      pipEl.style.transform = 'translateX(' + _scrollPos + 'px)';

      window._pipFadeTimer = null;
      pipEl.style.opacity = _paused ? '0.85' : '1';
      startLoop();
    }, 200);
  }

  // Handle content updates from the main process.
  // Null sentinel ensures the first call (even with empty content) goes through.
  let _lastContentHtml = null;

  const api = window.pipApi || {
    // Browser/dev fallback so the preview renders without the preload bridge
    onContent: (cb) => setTimeout(() => cb(
      '<span class="ticker-item">🔴 High priority task</span>' +
      '<span class="ticker-item">🟠 Design review</span>' +
      '<span class="ticker-item">🟢 Ship v1.13.3</span>'
    ), 300),
    onTheme: () => {},
    closePip: () => {},
  };

  api.onContent((html) => {
    const normalized = (html || '').replace(/\s+/g, ' ').trim();
    if (normalized === _lastContentHtml) return; // No real change — keep scrolling
    _lastContentHtml = normalized;
    setContent(html || '');
  });

  api.onTheme((theme) => {
    document.body.className = 'theme-' + theme;
  });

  // Close button click
  closeBtn.addEventListener('click', () => api.closePip());

  // Right-click anywhere closes
  document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    api.closePip();
  });

  // Hover pause + dim (dim in JS so it doesn't override the fade transition)
  document.body.addEventListener('mouseenter', () => { _paused = true; pipEl.style.opacity = '0.85'; });
  document.body.addEventListener('mouseleave', () => { _paused = false; pipEl.style.opacity = '1'; });

  // Re-fill the train when the window is resized so the seamless wrap never
  // shows a blank gap, preserving the current scroll ratio.
  let _resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(_resizeTimer);
    _resizeTimer = setTimeout(() => {
      if (!_singleHtml) return;
      const ratio = Math.min(0.99, Math.abs(_scrollPos) / (_oneCopyWidth || 1));
      _oneCopyWidth = renderCopies(_singleHtml);
      _scrollPos = -(ratio * _oneCopyWidth);
      if (Math.abs(_scrollPos) >= _oneCopyWidth) _scrollPos = 0;
      pipEl.style.transform = 'translateX(' + _scrollPos + 'px)';
    }, 150);
  });

  // Clean up on unload
  window.addEventListener('beforeunload', () => {
    stopLoop();
    if (window._pipFadeTimer) clearTimeout(window._pipFadeTimer);
  });
})();
</script></body>
</html>
