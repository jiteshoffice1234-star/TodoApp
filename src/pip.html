<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; font-family: sans-serif; height: 100vh; display: flex; align-items: center; -webkit-app-region: drag; transition: background 0.3s; }
body.dark { background: #1a1a1a; }
body.light { background: #f0f2f5; }
#pipContent { display: inline-block; white-space: nowrap; animation: scroll 20s linear infinite; pointer-events: none; }
.todo-item { display: inline-block; padding: 0 30px; font-weight: bold; font-size: 16px; transition: color 0.3s; }
body.dark .todo-item { color: #00ffcc; }
body.light .todo-item { color: #1a1a2e; }
@keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
</style></head>
<body class="dark"><div id="pipContent"></div>
<script>
function setContent(html){document.getElementById('pipContent').innerHTML=html;}
function setTheme(isDark){document.body.className=isDark?'dark':'light';}
</script></body>
</html>
