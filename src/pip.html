<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; align-items: center; -webkit-app-region: drag; user-select: none; }
body.theme-light { background: #1a1a1a; }
body.theme-dark { background: #0a0a0a; }
body.theme-neobrutalism { background: #1a1a00; }
body.theme-glass { background: #000000; }
body.theme-minimal { background: #000000; }
body.theme-clay { background: #3D3028; }
#pipContent { display: inline-block; white-space: nowrap; will-change: transform; pointer-events: none; animation: scroll 30s linear infinite; }
body:hover #pipContent { animation-play-state: paused; }
.todo-item { display: inline-block; padding: 0 15px; font-weight: 600; font-size: 13px; }
body.theme-light .todo-item { color: #00ffcc; }
body.theme-dark .todo-item { color: #00ffcc; }
body.theme-neobrutalism .todo-item { color: #FFD700; }
body.theme-glass .todo-item { color: #64B4FF; }
body.theme-minimal .todo-item { color: #ffffff; }
body.theme-clay .todo-item { color: #D4A574; }
@keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
</style></head>
<body class="theme-light"><div id="pipContent"></div>
<script>
function setContent(html){document.getElementById('pipContent').innerHTML=html;}
function setTheme(theme){document.body.className='theme-'+theme;}
</script></body>
</html>
