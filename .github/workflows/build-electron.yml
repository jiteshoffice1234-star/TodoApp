name: Build Electron App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npx electron-builder --win --publish=never
        env:
          GH_TOKEN: ${{ github.token }}

      - name: List dist contents
        shell: pwsh
        run: Get-ChildItem -Path dist -Recurse -Name

      - name: Create GitHub Release (if not exists)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${{ github.ref_name }}" --json tagName 2>/dev/null || \
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Create dash-named copies for auto-updater
        shell: bash
        run: |
          cd dist
          for f in *.exe; do
            [ -f "$f" ] || continue
            dash_name=$(echo "$f" | tr ' ' '-')
            if [ "$f" != "$dash_name" ]; then
              cp "$f" "$dash_name"
              echo "  $f → $dash_name"
            fi
          done
          for f in *.exe.blockmap; do
            [ -f "$f" ] || continue
            dash_name=$(echo "$f" | tr ' ' '-')
            if [ "$f" != "$dash_name" ]; then
              cp "$f" "$dash_name"
              echo "  $f → $dash_name"
            fi
          done

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd dist
          for f in *.exe *.exe.blockmap latest.yml; do
            [ -f "$f" ] && gh release upload "${{ github.ref_name }}" "$f" --clobber
          done
